name: WPF Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Restore dependencies
      run: dotnet restore Friday.csproj
      
    - name: Build
      run: dotnet build Friday.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish Friday.csproj -c Release -o ./publish /p:UseAppHost=true

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WPF-App-Release
        path: ./publish
